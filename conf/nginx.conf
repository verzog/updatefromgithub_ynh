# For a subpath install, redirect /path (no trailing slash) to /path/.
# YunoHost uncomments this line only for subpath installs and strips it for
# root installs (the "#sub_path_only" prefix is handled by ynh_config_add_nginx).
#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Path to source
  alias __INSTALL_DIR__/;

  index index.php;

  try_files $uri $uri/ index.php;

  location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;

    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param REMOTE_USER $remote_user;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param SCRIPT_FILENAME $request_filename;
  }

  # Never serve the raw data directory or the PHP config over HTTP.
  location ~ /(config\.php|\.git) {
    deny all;
    return 403;
  }

  # Include SSOwat user panel.
  include conf.d/yunohost_panel.conf.inc;
}
