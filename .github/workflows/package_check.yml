# YunoHost package_check in GitHub Actions.
#
# package_check runs the real install / remove / upgrade / backup / restore /
# linter tests inside a YunoHost LXD container. It is the same tool YunoHost's
# own CI (ci-apps.yunohost.org) uses; running it here gives per-PR feedback.
#
# Notes:
#   * It needs LXD and YunoHost's container images, so it is heavy and slow
#     (expect 15-40 minutes) and only runs on GitHub-hosted Ubuntu runners.
#   * The canonical YunoHost test path is still the official CI you get by
#     submitting the app to the catalogue; this workflow is an extra, local-ish
#     safety net for development.

name: Package check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package_check:
    name: Install / upgrade / backup / restore (package_check)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the package
        uses: actions/checkout@v4.2.2
        with:
          path: updatefromgithub_ynh

      - name: Install dependencies and LXD
        run: |
          set -eux
          sudo apt-get update
          # python3-toml: package_check's tests.toml parser imports `toml`.
          # python3-pycurl: its URL-reachability test (lib/curl_tests.py) imports `pycurl`.
          sudo apt-get install -y lynx jq btrfs-progs python3-toml python3-pycurl
          sudo snap install lxd
          # snap puts lxc/lxd in /snap/bin, which is not in sudo's secure_path,
          # so package_check (which calls `sudo lxc ...`) can't find them.
          # Symlink them where sudo looks, as package_check's README instructs.
          sudo ln -sf /snap/bin/lxc /usr/local/bin/lxc
          sudo ln -sf /snap/bin/lxd /usr/local/bin/lxd
          # Give the runner user access to the LXD socket. The new group is
          # picked up below with `sg lxd` (a re-login is not possible on CI).
          sudo usermod -a -G lxd "$USER"

      - name: Initialise LXD
        run: |
          set -eux
          sudo lxd init --auto --storage-backend dir
          # GitHub-hosted runners ship Docker, whose iptables FORWARD policy is
          # DROP and blocks the LXD bridge, leaving containers without internet.
          # Allow forwarding so the test container can reach the network.
          sudo iptables -P FORWARD ACCEPT || true

      - name: Add the YunoHost image remote
        # Added as the runner user (not root) so package_check, which runs as
        # that user, finds the remote in its own LXC config.
        run: |
          sg lxd -c "lxc remote add yunohost https://repo.yunohost.org/incus \
            --protocol simplestreams --public" || true

      - name: Clone package_check (and adapt it to the runner)
        run: |
          set -eux
          git clone --depth 1 https://github.com/YunoHost/package_check
          # GitHub-hosted runners block outbound ICMP, so package_check's
          # ping-based internet check fails spuriously. Fall back to an HTTPS
          # probe (the app tests themselves are unaffected).
          sed -i 's#|| log_critical "Unable to connect to internet."#|| curl -sfI https://yunohost.org >/dev/null 2>\&1 || curl -sfI https://framasoft.org >/dev/null 2>\&1 || log_critical "Unable to connect to internet."#' package_check/lib/common.sh

      - name: Build the base YunoHost image
        # package_check needs a local base image (Debian container + YunoHost
        # installed), built once with --rebuild. This is the slow step: it
        # downloads a container and runs the full YunoHost install inside it.
        run: |
          set -eux
          cd package_check
          sg lxd -c "./package_check.sh --rebuild"

      - name: Run package_check
        run: |
          set -euo pipefail
          cd package_check
          # package_check always exits 0, even when tests fail, so capture its
          # output and fail the job ourselves if any test reported FAIL.
          sg lxd -c "./package_check.sh ../updatefromgithub_ynh" 2>&1 | tee run.log
          if grep -q -- "--- FAIL ---" run.log; then
            echo "::error::package_check reported at least one failing test (see log above)."
            exit 1
          fi
          echo "All package_check tests passed."

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: package-check-results
          path: |
            package_check/run.log
            package_check/full_log_*.log
            package_check/results_*.json
          if-no-files-found: ignore
